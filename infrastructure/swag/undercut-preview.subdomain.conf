server {
 listen 443 ssl;
 listen [::]:443 ssl;
 server_name undercut-preview.tylerallen.net;
 include /config/nginx/ssl-undercut.conf;
 access_log off;
 location / {
  include /config/nginx/proxy.conf;
  resolver 127.0.0.11 valid=30s ipv6=off;
  set $upstream_app undercut-preview-web;
  set $upstream_port 8080;
  set $upstream_proto http;
  proxy_pass $upstream_proto://$upstream_app:$upstream_port;
 }
}
