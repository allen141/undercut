map $uri $logged_path {
 ~^/api/auth/reset-password/ /api/auth/reset-password/[redacted];
 default $uri;
}
log_format undercut '$remote_addr "$request_method $logged_path" $status $body_bytes_sent';

server {
 listen 8080;
 server_name _;
 root /usr/share/nginx/html;
 access_log /dev/stdout undercut;
 resolver 127.0.0.11 valid=10s ipv6=off;
 add_header X-Content-Type-Options nosniff always;
 add_header Referrer-Policy no-referrer always;
 add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; connect-src 'self'; font-src 'self'; worker-src 'self' blob:; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;
 location = /healthz { access_log off; return 200 'ok'; }
 location /api/ {
  set $upstream http://api:3001;
  proxy_pass $upstream$request_uri;
  proxy_set_header Host $host;
  proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
  proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  proxy_set_header X-Real-IP $remote_addr;
 }
 location /assets/ { expires 1y; try_files $uri =404; }
 location / { expires -1; try_files $uri $uri/ /index.html; }
}
